name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - name: Verify generated CSS is committed
        run: git diff --exit-code -- src/main/resources/assets/pologen.css
      - run: ./gradlew test
      - run: ./gradlew shadowJar
